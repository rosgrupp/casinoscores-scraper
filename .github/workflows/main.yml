name: Scarica dati Super Color Game ogni 72 ore

on:
  schedule:
    - cron: "0 0 */3 * *"  # ogni 3 giorni (equivale a 72 ore)
  workflow_dispatch:        # consente di avviarlo anche manualmente
  
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui script Python
        run: python main.py

      - name: Commit e push dei risultati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add risultati/*.json
          git commit -m "📊 Aggiornamento automatico risultati $(date '+%Y-%m-%d %H:%M')" || echo "Nessun file nuovo"
          git push
