name: Casinò Scraper ogni giorno (verifica 72h)

# Esegui ogni giorno; lo script decide se procedere (serve per esattezza 72h)
on:
  schedule:
    - cron: '0 0 * * *'   # ogni giorno a 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # permette al workflow di fare git push

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python main.py

      - name: Commit and push results (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risultato_*.json last_run.txt || true
          git commit -m "Aggiornamento dati $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "Nessun cambiamento da committare"
          git push
